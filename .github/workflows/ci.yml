name: Portable core verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned solver dependencies and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Run full test discovery (external-checker tests explicitly skip)
        run: python -m unittest discover -s tests -v
      - name: Report assurance availability
        run: python -m epv doctor
  proof-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned solver dependencies and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Provision fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build pinned upstream Carcara with its lockfile
        run: rustup run 1.98.1 bash scripts/setup_carcara.sh
      - name: Full assurance reproduction with the real checker
        run: python -m epv.reproduce --full
      - name: Require all discovered tests to run without skips
        run: |
          python - <<'PY'
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          if not result.wasSuccessful() or result.skipped or not result.testsRun:
              raise SystemExit('Full assurance requires successful, nonempty, zero-skip discovery')
          PY
