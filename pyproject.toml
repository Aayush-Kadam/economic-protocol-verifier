[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-protocol-verifier"
version = "0.1.0"
description = "Auditable verification of finite economic mechanisms"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Research preview; see LICENSE"}
authors = [{name = "Aayush Kadam"}]
dependencies = []

[project.optional-dependencies]
m2 = ["cvc5==1.4.1", "z3-solver==5.1.0.0"]

[project.scripts]
epv = "epv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
